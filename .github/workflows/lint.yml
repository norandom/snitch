name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - name: ruff (settings in pyproject.toml)
        run: uvx ruff@0.16.10 check --output-format github snitch

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build + vet + test (the BPF object and its Go bindings are committed; no clang needed)
        run: |
          gofmt -l . | tee /dev/stderr | wc -l | grep -qx 0
          go build ./...
          go vet ./...
          go test ./...
      - name: caps (functions <= 40 lines, cyclomatic <= 10, files <= 300 lines)
        run: scripts/caps.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck snitch-trial scripts/*.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - name: actionlint
        run: uvx --from actionlint-py actionlint -color
