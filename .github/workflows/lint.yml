name: lint

# ci-debs (Req 1.1, 2.4): every job below is a thin dispatch into the Dagger module
# at the repo root - the workflow carries no pipeline logic of its own beyond the
# dispatch, and a green CI run means the same checks a green local `dagger call
# <function>` run means. The toolchains live in the module's pinned containers, so
# the setup-go/setup-uv steps are gone: the runner only checks out and dispatches.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow runs these jobs first (deploy-service, Req 1.4)

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.12"
          verb: call
          call: ruff

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.12"
          verb: call
          call: go

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.12"
          verb: call
          call: shellcheck

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.12"
          verb: call
          call: actionlint

  linters:
    # The ci-debs linter layer (Req 2.1, 2.2): golangci-lint over the Go packages and
    # cppcheck over the BPF C sources, plus the c-hardening bindings check (Req 7.1):
    # internal/bpf/ regenerated with the pinned clang and compared byte for byte with
    # the committed bindings. Each is its own dispatch so the runner's log names the
    # function that failed. Three calls in one job boot the engine container once -
    # the later calls reuse it and its warm caches - so the three cost one engine
    # plus three sessions, not three engines. The bindings check sits here because
    # its compiler is an observer only (Req 7.6): it compares and exports nothing,
    # and like the other linters it is skipped on v* tags, so the release still
    # builds from the committed bindings with no C compiler in its gate (Req 7.7).
    # The v*-tag skip (ci-debs Req 6.2): the release workflow calls this file over
    # the pinned six-asset gate and the new phase must not join that gate. github.ref
    # inside a called workflow is the caller's ref (GitHub's workflow_call docs: the
    # event payload is the caller's), so the condition holds on the release's tag
    # push exactly as it does on lint's own runs.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.12"
          verb: call
          call: golangci
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.12"
          verb: call
          call: cppcheck
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.12"
          verb: call
          call: bindings
