name: release

# A tag vX.Y.Z becomes a GitHub release: the lint workflow's jobs run first (Req 1.4), then
# one static amd64 build with the tag linked in as the version (Req 1.1, 1.2). Nothing is
# published when any earlier job fails: `needs:` stops the chain (Req 1.3). Only the publish
# job may write to the repository; the VM repo pins the tag and the sha256 of the asset.
# Since the kde-tray spec (its Req 9.4): a second static build, the client binary `snitch`,
# published as `snitch-linux-amd64` with its checksum. The asset name is pinned (consuming
# repos match it); the legacy Python client and trial script have retired.
# Since the ci-debs spec: both artifact lanes build through the Dagger module - the existing
# static pair (`release-build`, byte-parity with the steps above) and the deb pair
# (`deb-release`, the proof + assembly + smoke composite) - and the publish job needs both
# artifact sets before it touches a release. Six assets publish atomically (`snitchd`,
# `snitchd.sha256`, `snitch-linux-amd64`, `snitch-linux-amd64.sha256`, and the deb +
# its sha256), and the one existence loop checks all six before any gh call, so the
# publication is all-or-nothing, never half-way (ci-debs Req 6.3).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    # The same gate as before the feature: workflow_call lint.yml, where the linters
    # job skips itself on this tag push (ci-debs Req 6.2 - the new phase never joins
    # the existing assets' gate).
    uses: ./.github/workflows/lint.yml

  release-build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.12"
          verb: call
          call: release-build --version=${{ github.ref_name }} --output=dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: dist

  deb:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.12"
          verb: call
          call: deb-release --version=${{ github.ref_name }} --docker-socket=/var/run/docker.sock --output=dist-deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-release
          path: dist-deb

  publish:
    needs: [release-build, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-build
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: deb-release
          path: dist-deb
      - name: publish the assets (replace when the release exists, create it otherwise)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(dist/snitchd dist/snitchd.sha256 dist/snitch-linux-amd64 dist/snitch-linux-amd64.sha256 dist-deb/snitch_${GITHUB_REF_NAME#v}_amd64.deb dist-deb/snitch_${GITHUB_REF_NAME#v}_amd64.deb.sha256)
          for f in "${assets[@]}"; do [ -f "$f" ] || { echo "missing asset: $f" >&2; exit 1; }; done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --generate-notes
          fi
