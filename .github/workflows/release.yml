name: release

# A tag vX.Y.Z becomes a GitHub release: the lint workflow's jobs run first (Req 1.4), then
# one static amd64 build with the tag linked in as the version (Req 1.1, 1.2). Nothing is
# published when any earlier job fails: `needs:` stops the chain (Req 1.3). Only the publish
# job may write to the repository; the VM repo pins the tag and the sha256 of the asset.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/lint.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: static build, version = tag (the BPF object and its Go bindings are committed; no clang needed)
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/snitchd ./cmd/snitchd
          [ "$(dist/snitchd -version)" = "$GITHUB_REF_NAME" ]
      - name: sha256 (the form `sha256sum -c` reads)
        run: |
          set -euo pipefail
          (cd dist && sha256sum snitchd > snitchd.sha256)
          cat dist/snitchd.sha256
      - name: publish the assets (replace when the release exists, create it otherwise)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(dist/snitchd dist/snitchd.sha256 snitch snitch-trial)
          for f in "${assets[@]}"; do [ -f "$f" ] || { echo "missing asset: $f" >&2; exit 1; }; done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --generate-notes
          fi
