name: codeql

# ci-debs (Req 3.1-3.4): the security-oriented dataflow scan. A separate workflow by
# design - never referenced by the release chain - so an extraction or analysis error
# fails visibly here while a security finding only surfaces in code scanning for
# review: findings never gate a release (Req 3.3, 3.4). No continue-on-error
# anywhere: the analyze action's own semantics already draw the right line.
#
# Matrix: go and c-cpp are traced (build-mode manual: init arms the trace observer and
# the build step after it is what the database sees). go: setup-go runs before init so the
# toolchain is on PATH, and the traced build is the pipeline's own `go build ./...`.
# c-cpp (c-hardening follow-up, user decision 2026-11-25): an observation compile of both
# BPF programs with the runner's clang and libbpf headers, output to /dev/null - the
# compiler observes, it produces nothing that is kept (the committed bindings, checked
# byte for byte by the pipeline's bindings check, are what ships). The flags are the
# project's (internal/bpf/gen.go) without -Werror: the runner's libbpf 1.3 declares
# bpf_d_path without the const forky's 1.7 has, a warning that must not stop the
# observation. Traced extraction replaces none-mode's inferred compilation units and its
# macro-accuracy caveat, which mattered most for dns.bpf.c, the parser of
# attacker-shaped DNS answers.
# Each language carries its own category, so the two results land as two Sarif
# uploads, both under the security-extended suite.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly, Monday nights: the scheduled run re-analyzes main even without pushes
    - cron: '15 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# The minimum token permissions the starter's own shape asks for (code scanning
# upload, the checkout, the pack fetch)
permissions:
  security-events: write
  contents: read
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: c-cpp
            build-mode: manual
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The toolchain lands before init: a manual-mode trace builds with it
      - name: Install go (go.mod's toolchain, for the traced build)
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install clang and the libbpf headers (for the traced observation compile)
        if: matrix.language == 'c-cpp'
        run: sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends clang libbpf-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ./.github/codeql-config.yml

      # The traced build: the exact command the pipeline's own go check runs, so the
      # database covers what CI actually builds
      - name: Build (traced)
        if: matrix.language == 'go'
        run: go build ./...

      # The traced observation compile: gen.go's flags minus -Werror, output discarded
      - name: Compile the BPF programs (traced, output discarded)
        if: matrix.language == 'c-cpp'
        run: |
          flags="-target bpf -D__TARGET_ARCH_x86 -O2 -g -Wall -Wno-missing-declarations -Wextra -Wshadow -Wvla -Wundef -Wpointer-arith -Wimplicit-fallthrough -Wstrict-prototypes -Wnull-dereference -Wconversion -isystem bpf"
          clang $flags -c bpf/snitch.bpf.c -o /dev/null
          clang $flags -mcpu=v3 -c bpf/dns.bpf.c -o /dev/null

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
