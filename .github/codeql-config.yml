# ci-debs (Req 3.2): the minimal CodeQL configuration. The one knob it sets is
# paths-ignore, trimming trees that are not source for any of the three analyzed
# languages (go, c-cpp, python), so the databases cover what the traced go build
# and the none-mode extractors actually consume. The Go packages (cmd/, internal/,
# tools/) and the BPF C sources (bpf/*.bpf.c beside their vmlinux.h) are analyzed -
# NOT ignored. The extension-less python client is not ignorable here; it simply
# does not match the extractor (the documented R3.2 limitation, docs/ci-debs.md).
#
# runs of paths-ignore:
paths-ignore:
  # The pipeline module: real Go code, but its own separate go module, built inside
  # the Dagger engine's container - never by the traced `go build ./...` this
  # workflow runs, so a Go database over it would be untraced noise, not analysis.
  - .dagger/**

  # The feature's spec/design/research and the agent-skill doc trees: markdown
  # trees, not source for any of the three languages.
  - .kiro/**
  - .claude/**

  # Documentation screenshots (images only) and the repo's other markdown (README,
  # walkthroughs): no extractor consumes them.
  - docs/**
  - "**/*.md"

  # The documented sample rules.toml and its api.md walkthrough: a sample, not code
  # the service executes.
  - examples/**

  # The committed bytecode cache (generated, accidentally committed long ago).
  - __pycache__/**
