# shellcheck shell=sh
# Append snitch's lsm= boot parameter when the helper is installed.
# On package removal the helper is gone, leaving this conffile inert.
if [ -x /usr/lib/snitch/lsm-cmdline ]; then
	snitch_lsm_arg=$(/usr/lib/snitch/lsm-cmdline -- "${GRUB_CMDLINE_LINUX:-} ${GRUB_CMDLINE_LINUX_DEFAULT:-}" || true)
	if [ -n "$snitch_lsm_arg" ]; then
		# shellcheck disable=SC2034
		GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }$snitch_lsm_arg"
	fi
	unset snitch_lsm_arg
fi
